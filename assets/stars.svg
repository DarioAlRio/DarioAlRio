<svg xmlns="http://www.w3.org/2000/svg" width="130" height="58" viewBox="0 0 130 58" role="img" aria-label="STARS: 0">
  <defs>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="c"><rect x="12" y="12" width="106" height="34" rx="8"/></clipPath>
